[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
exclude = ["core/importing/_origin_parser/*.py", ".tmp/*.py"]
